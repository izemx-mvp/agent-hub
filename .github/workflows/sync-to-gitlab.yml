name: Sync to GitLab

on:
  push:
    branches: [develop, main, staging]

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITLAB_HOST: mc-git.com
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_NAMESPACE_ID: ${{ vars.GITLAB_NAMESPACE_ID }}
      REPO_NAME: ${{ github.event.repository.name }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure GitLab project exists
        run: |
          if [ -z "${GITLAB_TOKEN}" ] || [ -z "${GITLAB_NAMESPACE_ID}" ]; then
            echo "ERROR: set org secret GITLAB_TOKEN and org variable GITLAB_NAMESPACE_ID"
            exit 1
          fi
          HTTP=$(curl -s -o /tmp/gl.json -w "%{http_code}" \
            --request POST \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --data "name=${REPO_NAME}" \
            --data "path=${REPO_NAME}" \
            --data "namespace_id=${GITLAB_NAMESPACE_ID}" \
            --data "visibility=private" \
            "http://${GITLAB_HOST}/api/v4/projects")
          echo "GitLab create-project HTTP ${HTTP}"
          cat /tmp/gl.json || true
          if [ "$HTTP" != "201" ] && [ "$HTTP" != "400" ] && [ "$HTTP" != "409" ]; then
            echo "Unexpected response creating project"
            exit 1
          fi

      - name: Push to GitLab
        run: |
          git config user.email "github-sync@izemx.com"
          git config user.name "GitHub Sync"
          git remote add gitlab "http://oauth2:${GITLAB_TOKEN}@${GITLAB_HOST}/izemx/client/mvp/${REPO_NAME}.git"
          git push gitlab "HEAD:${BRANCH}" --force-with-lease
